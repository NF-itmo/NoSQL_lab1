services:
  postgres:
    image: postgres:13.3
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      POSTGRES_DB: "db"
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    networks:
      - postgres_net

  backend:
    image: nosql-lab1-backend:latest
    depends_on:
      postgres: 
        condition: service_started
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      POSTGRES_URL: postgresql://postgres:5432/db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      ETCD_ENDPOINTS: http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
    networks:
      - postgres_net
      - etcd_net
    ports:
      - "8080:8080"

  # На заметку: https://etcd.io/docs/v2.3/docker_guide/
  etcd1:
    image: quay.io/coreos/etcd:v3.5.0
    volumes:
      - etcd1_data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=etcd-cluster-1
      - --initial-cluster-state=new
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - etcd_net

  etcd2:
    image: quay.io/coreos/etcd:v3.5.0
    volumes:
      - etcd2_data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=etcd-cluster-1
      - --initial-cluster-state=new
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - etcd_net

  etcd3:
    image: quay.io/coreos/etcd:v3.5.0
    volumes:
      - etcd3_data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=etcd-cluster-1
      - --initial-cluster-state=new
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - etcd_net

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  postgres_data:

networks:
  postgres_net:
  etcd_net: