services:
  backend:
    image: nosql-lab1-backend:latest
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - "8080:8080"

  # На заметку: https://etcd.io/docs/v2.3/docker_guide/
  etcd: 
    image: quay.io/coreos/etcd:v3.5.0
    ports:
      - "2379:2379" # для клиентов
      - "2380:2380" # для связи с кластером (надо ли?)
    volumes:
      - etcd-data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --name=s1
      - --data-dir=/etcd-data
      - --initial-cluster-token=etcd-cluster-1
      - --initial-cluster-state=new

volumes:
  etcd-data: